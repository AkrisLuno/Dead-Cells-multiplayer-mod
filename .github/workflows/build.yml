name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download DCCM MDK
        shell: pwsh
        run: |
          $dccm = Join-Path $env:RUNNER_TEMP 'dccm'
          $archive = Join-Path $env:RUNNER_TEMP 'dccm.zip'
          Invoke-WebRequest -Uri 'https://github.com/dead-cells-core-modding/core/releases/download/v35.14.1/win-x64.zip' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $dccm
          $mdkRoot = Join-Path $dccm 'core\mdk'
          "DCCM_MDK_ROOT=$mdkRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        run: dotnet build -c Release

      - name: Run Tests
        run: dotnet test -c Release --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeadCellsMultiplayerMod
          path: src/bin/Release/net10.0/win-x64/output/DeadCellsMultiplayerMod/
          if-no-files-found: error
